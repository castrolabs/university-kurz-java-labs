# Given: an app that exposes Prometheus metrics on /metrics, its ServiceMonitor, and a client that keeps
# calling a page that does not exist (404).
apiVersion: v1
kind: Namespace
metadata: {name: shop}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: example-app, namespace: shop}
spec:
  replicas: 2
  selector: {matchLabels: {app: example-app}}
  template:
    metadata: {labels: {app: example-app}}
    spec:
      containers:
        - name: example-app
          image: quay.io/brancz/prometheus-example-app:v0.5.0
          ports:
            - {name: web, containerPort: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: example-app
  namespace: shop
  labels: {app: example-app}
spec:
  selector: {app: example-app}
  ports:
    - {name: web, port: 8080}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: example-app
  namespace: shop
  labels: {release: lab}
spec:
  selector:
    matchLabels: {app: example-app}
  endpoints:
    - {port: web, interval: 5s}
---
apiVersion: v1
kind: Pod
metadata: {name: bad-client, namespace: shop}
spec:
  containers:
    - name: client
      image: busybox:1.37
      command: ["sh", "-c", "while true; do wget -q -O /dev/null http://example-app:8080/err; sleep 1; done"]
