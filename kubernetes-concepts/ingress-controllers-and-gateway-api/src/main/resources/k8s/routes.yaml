# shop.lab through an Ingress (handled by Traefik, the cluster's default IngressClass).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: web
spec:
  rules:
    - host: shop.lab
      http:
        paths:
          # TODO-00: The home page works, but every other page of the shop (/cart/, ...) is a 404.
          - path: /
            pathType: Exact
            backend:
              service: {name: shop, port: {number: 8080}}
---
# blog.lab through the Gateway API. Traefik created a GatewayClass "traefik" and a Gateway
# "traefik-gateway" in kube-system (listener "web" on Traefik's port 8000).
# TODO-01: This route never serves anything. Read its status conditions and fix it, without changing
#          anything in kube-system (that Gateway belongs to the platform team).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: blog
  namespace: web
spec:
  parentRefs:
    - {name: traefik-gateway, namespace: kube-system}
  hostnames: [blog.lab]
  rules:
    - backendRefs:
        - {name: blog, port: 8080}
