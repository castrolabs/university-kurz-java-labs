# Given: Pebble, Let's Encrypt's own ACME test server, standing in for Let's Encrypt. It validates
# challenges for real: for HTTP-01 it fetches http://<domain>/.well-known/acme-challenge/<token>.
# The lab's domains resolve to the ingress controller through the cluster DNS (see coredns-custom.yaml),
# as public DNS resolves yours.
apiVersion: v1
kind: Secret
metadata: {name: pebble-tls, namespace: cert-manager}
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 
---
apiVersion: v1
kind: ConfigMap
metadata: {name: pebble-config, namespace: cert-manager}
data:
  pebble-config.json: |
    {"pebble": {"listenAddress": "0.0.0.0:14000", "managementListenAddress": "0.0.0.0:15000",
      "certificate": "/tls/tls.crt", "privateKey": "/tls/tls.key", "httpPort": 80, "tlsPort": 443,
      "ocspResponderURL": "", "externalAccountBindingRequired": false, "retryAfter": {"authz": 3, "order": 5},
      "keyAlgorithm": "ecdsa", "profiles": {"default": {"description": "default", "validityPeriod": 7776000}}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: pebble, namespace: cert-manager}
spec:
  selector: {matchLabels: {app: pebble}}
  template:
    metadata: {labels: {app: pebble}}
    spec:
      containers:
        - name: pebble
          image: ghcr.io/letsencrypt/pebble:2.10.1
          args: ["-config", "/config/pebble-config.json"]
          env:
            - {name: PEBBLE_VA_NOSLEEP, value: "1"}       # validate right away
            - {name: PEBBLE_WFE_NONCEREJECT, value: "0"}  # no random bad-nonce errors
          ports: [{containerPort: 14000}, {containerPort: 15000}]
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: tls, mountPath: /tls}
      volumes:
        - name: config
          configMap: {name: pebble-config}
        - name: tls
          secret: {secretName: pebble-tls}
---
apiVersion: v1
kind: Service
metadata: {name: pebble, namespace: cert-manager}
spec:
  selector: {app: pebble}
  ports:
    - {name: acme, port: 14000}
    - {name: mgmt, port: 15000}
---
# The shop, and a client to call it over HTTPS.
apiVersion: v1
kind: Namespace
metadata: {name: web}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: shop, namespace: web}
spec:
  selector: {matchLabels: {app: shop}}
  template:
    metadata: {labels: {app: shop}}
    spec:
      containers:
        - name: shop
          image: busybox:1.37
          command: ["sh", "-c", "mkdir -p /www && echo shop > /www/index.html && exec httpd -f -p 8080 -h /www"]
---
apiVersion: v1
kind: Service
metadata: {name: shop, namespace: web}
spec: {selector: {app: shop}, ports: [{port: 8080}]}
---
apiVersion: v1
kind: Pod
metadata: {name: client}
spec:
  containers:
    - {name: client, image: "mirror.gcr.io/curlimages/curl:8.22.0", command: ["sleep", "3600"]}
