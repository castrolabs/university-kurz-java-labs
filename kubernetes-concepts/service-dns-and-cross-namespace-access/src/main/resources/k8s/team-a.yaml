apiVersion: v1
kind: Namespace
metadata:
  name: team-a
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: team-a
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: api
          image: busybox:1.37
          command: ["sleep", "infinity"]
          env:
            # TODO-00: The database is the Service "db" in the namespace "shared". Fix this URL.
            - name: DB_URL
              value: "http://db:8080"
          readinessProbe:   # ready only while the database answers
            exec:
              command: ["sh", "-c", "wget -qO- -T 2 \"$DB_URL\""]
            periodSeconds: 2
---
# A legacy app whose database URL is baked into the image: it always calls http://database:8080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy
  namespace: team-a
spec:
  replicas: 1
  selector:
    matchLabels: {app: legacy}
  template:
    metadata:
      labels: {app: legacy}
    spec:
      containers:
        - name: legacy
          image: busybox:1.37
          command: ["sleep", "infinity"]
          readinessProbe:
            exec:
              command: ["wget", "-qO-", "-T", "2", "http://database:8080"]
            periodSeconds: 2
# TODO-01: You cannot change the legacy app. Make the name "database" work in team-a and point it at the
#          same database, without running a second copy or hard-coding an IP address.
