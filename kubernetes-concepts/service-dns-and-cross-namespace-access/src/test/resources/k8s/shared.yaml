# Given: the database in the shared namespace (an HTTP server standing in for it).
apiVersion: v1
kind: Namespace
metadata:
  name: shared
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: shared
spec:
  replicas: 1
  selector:
    matchLabels: {app: db}
  template:
    metadata:
      labels: {app: db}
    spec:
      containers:
        - name: db
          image: busybox:1.37
          command: ["sh", "-c", "mkdir -p /www && echo 'db ok' > /www/index.html && exec httpd -f -p 8080 -h /www"]
          ports:
            - {name: db, containerPort: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: shared
spec:
  selector: {app: db}
  ports:
    - {port: 8080, targetPort: db}
