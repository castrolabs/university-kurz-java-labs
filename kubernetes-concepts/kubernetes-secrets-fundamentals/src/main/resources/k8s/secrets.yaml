# The database password is s3cret. Someone created this value with:  echo s3cret | base64
# TODO-00: The api never becomes ready. Decode the value (base64 -d | od -c) and fix it.
# TODO-01: This Secret must never change in place: a new password means a new Secret and a rollout.
apiVersion: v1
kind: Secret
metadata:
  name: db-creds
  namespace: shop
type: Opaque
data:
  password: czNjcmV0Cg==
---
# The reports job reads its own token, report-creds, from the API.
# TODO-02: "list" returns the contents of every Secret in the namespace, including db-creds. Give the
#          reports ServiceAccount access to report-creds only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: reports
  namespace: shop
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: reports
  namespace: shop
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: reports}
subjects:
  - {kind: ServiceAccount, name: reports, namespace: shop}
