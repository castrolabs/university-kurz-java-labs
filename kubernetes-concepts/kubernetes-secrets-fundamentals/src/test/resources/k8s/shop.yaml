# Given: a "database" that only accepts user app with password s3cret (an HTTP server with basic auth
# standing in for it), the api that connects to it with the password from Secret db-creds, and the
# ServiceAccount of a reporting job.
apiVersion: v1
kind: Namespace
metadata: {name: shop}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: db, namespace: shop}
spec:
  selector: {matchLabels: {app: db}}
  template:
    metadata: {labels: {app: db}}
    spec:
      containers:
        - name: db
          image: busybox:1.37
          command: ["sh", "-c", "mkdir -p /www && echo connected > /www/index.html && echo '/:app:s3cret' > /tmp/httpd.conf && exec httpd -f -p 8080 -h /www -c /tmp/httpd.conf"]
---
apiVersion: v1
kind: Service
metadata: {name: db, namespace: shop}
spec: {selector: {app: db}, ports: [{port: 8080}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: shop}
spec:
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
        - name: api
          image: busybox:1.37
          command: ["sleep", "infinity"]
          env:
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: db-creds, key: password}}
          readinessProbe:   # ready only while the database accepts the password
            exec: {command: ["sh", "-c", "wget -q -O /dev/null \"http://app:${DB_PASSWORD}@db:8080/\""]}
            periodSeconds: 2
---
apiVersion: v1
kind: Secret
metadata: {name: report-creds, namespace: shop}
stringData: {token: "reports-only"}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: reports, namespace: shop}
