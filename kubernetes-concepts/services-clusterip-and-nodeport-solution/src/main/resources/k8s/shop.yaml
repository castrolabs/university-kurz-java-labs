apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
spec:
  replicas: 2
  selector:
    matchLabels: {app: shop, tier: web}
  template:
    metadata:
      labels: {app: shop, tier: web}
    spec:
      containers:
        - name: shop
          image: busybox:1.37
          command: ["sh", "-c", "mkdir -p /www && echo 'shop ok' > /www/index.html && exec httpd -f -p 8080 -h /www"]
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 2
---
# Inside the cluster: http://shop on port 80.
apiVersion: v1
kind: Service
metadata:
  name: shop
spec:
  selector: {app: shop, tier: web}   # must match the Pod labels, not the Deployment name
  ports:
    - {port: 80, targetPort: http}   # the container's named port (8080), not the Service port
---
# Outside the cluster: port 30080 on every node.
apiVersion: v1
kind: Service
metadata:
  name: shop-public
spec:
  type: NodePort
  selector: {app: shop, tier: web}
  ports:
    - {port: 80, targetPort: http, nodePort: 30080}   # default range: 30000-32767
