apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: web
          image: nginx:1.29-alpine
          ports:
            - {name: http, containerPort: 80}
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 2
          # TODO-00: Harden this container: read-only root filesystem, no privilege escalation, no Linux
          #          capabilities at all, the runtime's default seccomp profile, and a non-root user.
          # TODO-01: The official nginx image cannot run like that. Read the container logs and make it work,
          #          either by giving nginx writable directories or by switching to an image built to run
          #          unprivileged. The Service below must keep answering on port 80.
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: {app: web}
  ports:
    - {port: 80, targetPort: http}
