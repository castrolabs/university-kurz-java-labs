# Given: the company registry, serving HTTPS on registry.lab:5443 with a certificate signed by the
# company's private CA, and a Job that copies busybox into it as registry.lab:5443/tools/busybox:1.37.
# (registry.lab resolves to this machine through /etc/hosts.)
apiVersion: v1
kind: Namespace
metadata: {name: registry}
---
apiVersion: v1
kind: Secret
metadata: {name: registry-tls, namespace: registry}
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: registry, namespace: registry}
spec:
  selector: {matchLabels: {app: registry}}
  template:
    metadata: {labels: {app: registry}}
    spec:
      hostNetwork: true
      containers:
        - name: registry
          image: mirror.gcr.io/library/registry:3
          env:
            - {name: REGISTRY_HTTP_ADDR, value: "0.0.0.0:5443"}
            - {name: REGISTRY_HTTP_TLS_CERTIFICATE, value: /certs/tls.crt}
            - {name: REGISTRY_HTTP_TLS_KEY, value: /certs/tls.key}
          volumeMounts: [{name: tls, mountPath: /certs}]
      volumes:
        - name: tls
          secret: {secretName: registry-tls}
---
apiVersion: batch/v1
kind: Job
metadata: {name: seed, namespace: registry}
spec:
  backoffLimit: 10
  template:
    spec:
      hostNetwork: true
      restartPolicy: OnFailure
      containers:
        - name: crane
          image: gcr.io/go-containerregistry/crane:latest
          args: ["copy", "mirror.gcr.io/library/busybox:1.37", "registry.lab:5443/tools/busybox:1.37", "--insecure"]
