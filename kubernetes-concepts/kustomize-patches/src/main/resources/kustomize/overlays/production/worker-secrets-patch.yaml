# TODO-01: Strategic merge replaces lists that have no merge key, and envFrom is one of them:
#          this patch silently drops the base's configMapRef to app-config. Keep both sources.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  template:
    spec:
      containers:
        - name: app
          envFrom:
            - secretRef: {name: worker-secrets}
