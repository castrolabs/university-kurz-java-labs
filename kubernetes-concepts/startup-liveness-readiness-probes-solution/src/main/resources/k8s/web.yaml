# Two replicas of a web app. VERSION=1 is healthy. The test later rolls out VERSION=2, which starts fine
# but is broken: it never serves /readyz.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: example
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: app
          image: busybox:1.37
          env:
            - {name: VERSION, value: "1"}
          command:
            - sh
            - -c
            - |
              mkdir -p /www && echo "v$VERSION" > /www/healthz
              [ "$VERSION" = 1 ] && echo ok > /www/readyz
              exec httpd -f -p 8080 -h /www
          ports:
            - {name: http, containerPort: 8080}
          # A new Pod only counts as available once /readyz answers, so a broken version stalls the
          # rollout (maxUnavailable rounds down to 0 with 2 replicas) instead of replacing healthy Pods.
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: example
spec:
  selector: {app: web}
  ports:
    - {port: 80, targetPort: http}
