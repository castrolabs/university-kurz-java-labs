# Given: the namespace shop with a cache, one stable Pod and two canary Pods.
apiVersion: v1
kind: Namespace
metadata: {name: shop}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: cache, namespace: shop}
spec:
  selector: {matchLabels: {app: cache}}
  template:
    metadata: {labels: {app: cache}}
    spec:
      terminationGracePeriodSeconds: 1
      containers: [{name: cache, image: "busybox:1.36", command: ["sleep", "infinity"]}]
---
apiVersion: v1
kind: Pod
metadata: {name: web-stable, namespace: shop, labels: {app: web, track: stable}}
spec:
  terminationGracePeriodSeconds: 1
  containers: [{name: web, image: "busybox:1.37", command: ["sleep", "infinity"]}]
---
apiVersion: v1
kind: Pod
metadata: {name: web-canary-1, namespace: shop, labels: {app: web, track: canary}}
spec:
  terminationGracePeriodSeconds: 1
  containers: [{name: web, image: "busybox:1.37", command: ["sleep", "infinity"]}]
---
apiVersion: v1
kind: Pod
metadata: {name: web-canary-2, namespace: shop, labels: {app: web, track: canary}}
spec:
  terminationGracePeriodSeconds: 1
  containers: [{name: web, image: "busybox:1.37", command: ["sleep", "infinity"]}]
