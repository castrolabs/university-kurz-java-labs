# A TLS terminator that must run as a non-root user and read its private key from a Secret.
# The key file must not be readable by "other" users.
apiVersion: v1
kind: Pod
metadata:
  name: app
  namespace: example
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000      # the image's default user is root
    runAsGroup: 1000
    # The kubelet gives the volume's files to group 1000 and adds group read: tls.key becomes 0440 root:1000.
    fsGroup: 1000
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "cat /etc/tls/tls.key > /dev/null && echo 'key loaded' && sleep 3600"]
      volumeMounts:
        - name: tls
          mountPath: /etc/tls
          readOnly: true
  volumes:
    - name: tls
      secret:
        secretName: app-tls
        defaultMode: 0400
