# Given: an app to stop, and a namespace that will get stuck when it is deleted.
apiVersion: v1
kind: Namespace
metadata:
  name: shop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: web
          image: busybox:1.37
          command: ["sleep", "infinity"]
---
apiVersion: v1
kind: Namespace
metadata:
  name: old-team
---
# A finalizer from a controller that was uninstalled long ago: nothing will ever remove it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: leftover
  namespace: old-team
  finalizers: ["example.com/cleanup"]
data:
  owner: "a controller that no longer exists"
