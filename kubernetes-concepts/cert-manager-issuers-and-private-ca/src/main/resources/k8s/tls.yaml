# HTTPS for shop.lab with a certificate from the company's private CA (Secret "lab-ca" in "web").
# TODO-00: The issuer never becomes Ready. Read its status and fix it (the CA Secret stays where it is).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: lab-ca
spec:
  ca:
    secretName: lab-ca
---
# TODO-02: Traefik picks a certificate by matching the requested host name against the names in each
#          certificate, and falls back to its default certificate when none matches.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: shop
  namespace: web
spec:
  secretName: shop-tls
  dnsNames: [www.shop.lab]
  issuerRef: {name: lab-ca, kind: ClusterIssuer}
---
# TODO-01: Once the certificate is issued, Traefik still serves its own default certificate. Check which
#          Secret this Ingress asks for.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: web
spec:
  tls:
    - hosts: [shop.lab]
      secretName: shop-cert
  rules:
    - host: shop.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: shop, port: {number: 8080}}
