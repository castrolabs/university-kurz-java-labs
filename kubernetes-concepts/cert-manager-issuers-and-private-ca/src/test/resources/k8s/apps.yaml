# Given: the shop, the company's private CA (as the team stored it, in their own namespace), and a
# client that trusts only that CA.
apiVersion: v1
kind: Namespace
metadata: {name: web}
---
apiVersion: v1
kind: Secret
metadata: {name: lab-ca, namespace: web}
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: shop, namespace: web}
spec:
  selector: {matchLabels: {app: shop}}
  template:
    metadata: {labels: {app: shop}}
    spec:
      containers:
        - name: shop
          image: busybox:1.37
          command: ["sh", "-c", "mkdir -p /www && echo shop > /www/index.html && exec httpd -f -p 8080 -h /www"]
---
apiVersion: v1
kind: Service
metadata: {name: shop, namespace: web}
spec: {selector: {app: shop}, ports: [{port: 8080}]}
