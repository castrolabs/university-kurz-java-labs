# The app refuses to start when REDIS_PORT is set to something that is not a number.
apiVersion: v1
kind: Pod
metadata:
  name: app
  namespace: example
spec:
  # Kubernetes injects <SERVICE>_PORT, <SERVICE>_SERVICE_HOST, ... for every Service in the namespace.
  # The Service "redis" produced REDIS_PORT=tcp://<ip>:6379, which collides with the app's own variable.
  enableServiceLinks: false
  containers:
    - name: app
      image: busybox:1.37
      command:
        - sh
        - -c
        - |
          port="${REDIS_PORT:-6379}"
          case "$port" in *[!0-9]*) echo "fatal: REDIS_PORT is not a number: $port" >&2; exit 1;; esac
          echo "connecting to redis:$port"
          sleep 3600
      envFrom:
        - configMapRef:
            name: app-config
        - configMapRef:
            name: feature-flags
            optional: true
      env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: password
        # Explicit env always wins over envFrom, whatever the order in the manifest.
        - name: LOG_LEVEL
          value: debug
