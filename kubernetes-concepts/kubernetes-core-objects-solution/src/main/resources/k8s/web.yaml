# The team's first deployment: a web server and a Service in front of it, in the namespace "shop".
apiVersion: v1
kind: Namespace
metadata:
  name: shop
---
# Deployment -> ReplicaSet -> Pods. The ReplicaSet recreates any Pod that disappears; the Deployment
# manages ReplicaSets across releases. The Pod definition moves, unchanged, into the template.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}      # must match the template's labels
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: web
          image: busybox:1.37
          command: ["sh", "-c", "mkdir -p /www && echo \"hello from $HOSTNAME\" > /www/index.html && exec httpd -f -p 8080 -h /www"]
          ports:
            - {name: http, containerPort: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: shop
spec:
  # Labels that every replica has; a label only one Pod carries selects only that Pod.
  selector: {app: web}
  ports:
    - {port: 80, targetPort: http}
