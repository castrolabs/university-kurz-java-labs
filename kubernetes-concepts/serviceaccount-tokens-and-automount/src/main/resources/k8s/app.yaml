# Namespace team-a runs two workloads:
# - web: a normal web app. It never calls the Kubernetes API.
# - watcher: a small tool that lists the namespace's ConfigMaps through the Kubernetes API. Nothing else.
#
# Someone made the watcher work by giving the namespace's default ServiceAccount the "edit" role.
# TODO-01: Delete this binding. Create a ServiceAccount config-watcher, a Role that can only get/list/watch
#          configmaps in team-a, a RoleBinding between them, and run the watcher Pod as config-watcher.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: default-edit, namespace: team-a}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: edit}
subjects:
  - {kind: ServiceAccount, name: default, namespace: team-a}
---
apiVersion: v1
kind: Pod
metadata: {name: web, namespace: team-a}
spec:
  # TODO-00: web gets an API token it never uses: whoever gets code execution in this container gets the
  #          ServiceAccount's permissions. Stop Kubernetes from mounting the token into this Pod.
  containers:
    - name: web
      image: busybox:1.37
      command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata: {name: watcher, namespace: team-a}
spec:
  containers:
    - name: watcher
      image: curlimages/curl:8.16.0
      command: ["sleep", "3600"]
