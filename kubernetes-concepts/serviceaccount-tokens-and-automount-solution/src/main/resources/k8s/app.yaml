# Namespace team-a runs two workloads:
# - web: a normal web app. It never calls the Kubernetes API.
# - watcher: a small tool that lists the namespace's ConfigMaps through the Kubernetes API. Nothing else.
#
# The watcher gets its own identity with exactly one permission; the default ServiceAccount gets nothing.
apiVersion: v1
kind: ServiceAccount
metadata: {name: config-watcher, namespace: team-a}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: read-configmaps, namespace: team-a}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: config-watcher, namespace: team-a}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: read-configmaps}
subjects:
  - {kind: ServiceAccount, name: config-watcher, namespace: team-a}
---
apiVersion: v1
kind: Pod
metadata: {name: web, namespace: team-a}
spec:
  automountServiceAccountToken: false   # no API credential in a container that never uses one
  containers:
    - name: web
      image: busybox:1.37
      command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata: {name: watcher, namespace: team-a}
spec:
  serviceAccountName: config-watcher
  containers:
    - name: watcher
      image: curlimages/curl:8.16.0
      command: ["sleep", "3600"]
