# The database under test (given, not part of the exercise).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: example
spec:
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: db}
  template:
    metadata:
      labels: {app: db}
    spec:
      containers:
        - name: db
          image: mariadb:11.8
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: db-root, key: password}}
            - {name: MARIADB_DATABASE, value: shop}
          readinessProbe:
            exec: {command: ["healthcheck.sh", "--connect"]}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: example
spec:
  selector: {app: db}
  ports: [{port: 3306}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-backups
  namespace: example
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
