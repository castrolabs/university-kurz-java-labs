# A scheduler that must never run twice at the same time (two instances would fire every job twice).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: singleton
  namespace: example
spec:
  replicas: 1
  # Recreate terminates every old Pod first; the new Pod is only created once they are gone.
  # The price is a short gap with no instance at all.
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: singleton}
  template:
    metadata:
      labels: {app: singleton}
    spec:
      terminationGracePeriodSeconds: 3
      containers:
        - name: scheduler
          image: busybox:1.37
          command: ["sleep", "3600"]
