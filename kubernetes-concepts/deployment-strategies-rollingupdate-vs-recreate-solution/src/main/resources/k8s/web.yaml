# A stateless web app with 2 replicas. It must keep serving at full capacity during every rollout,
# including a rollout of an image that turns out to be broken.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: example
spec:
  replicas: 2
  # One extra Pod is allowed, none may be missing: a new Pod that never becomes Ready stalls the rollout
  # while both old Pods keep serving.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: app
          image: busybox:1.37
          command: ["sh", "-c", "mkdir -p /www && echo ok > /www/index.html && exec httpd -f -p 8080 -h /www"]
          readinessProbe:
            httpGet: {path: /, port: 8080}
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: example
spec:
  selector: {app: web}
  ports:
    - {port: 80, targetPort: 8080}
