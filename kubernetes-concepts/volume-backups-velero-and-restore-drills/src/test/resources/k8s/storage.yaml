# Given: an S3-compatible object store (SeaweedFS) for the backups, with the credentials Velero uses.
apiVersion: v1
kind: Namespace
metadata: {name: storage}
---
apiVersion: v1
kind: Secret
metadata: {name: s3-config, namespace: storage}
stringData:
  s3.json: |
    {"identities": [{"name": "velero",
      "credentials": [{"accessKey": "lab", "secretKey": "lab-secret"}],
      "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: s3, namespace: storage}
spec:
  selector: {matchLabels: {app: s3}}
  template:
    metadata: {labels: {app: s3}}
    spec:
      containers:
        - name: seaweedfs
          image: mirror.gcr.io/chrislusf/seaweedfs:4.47
          args: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-master.volumeSizeLimitMB=64", "-volume.max=20", "-s3.config=/etc/s3/s3.json"]
          ports: [{containerPort: 8333}]
          volumeMounts: [{name: data, mountPath: /data}, {name: config, mountPath: /etc/s3}]
      volumes: [{name: data, emptyDir: {}}, {name: config, secret: {secretName: s3-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: s3, namespace: storage}
spec: {selector: {app: s3}, ports: [{port: 8333}]}
