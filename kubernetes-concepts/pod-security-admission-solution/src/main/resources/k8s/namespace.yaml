apiVersion: v1
kind: Namespace
metadata:
  name: prod
  labels:
    pod-security.kubernetes.io/enforce: restricted       # reject violating Pods
    pod-security.kubernetes.io/enforce-version: latest   # or pin a version, e.g. v1.36
    pod-security.kubernetes.io/warn: restricted          # warning returned to kubectl
    pod-security.kubernetes.io/audit: restricted         # annotation in the audit log
