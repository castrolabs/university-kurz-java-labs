# Three Pods on a small node. Each one has a resources problem.
apiVersion: v1
kind: Pod
metadata:
  name: worker
  namespace: example
spec:
  containers:
    - name: worker
      image: busybox:1.37
      # Builds a 150 MiB lookup table in memory, then serves from it.
      command: ["awk", "BEGIN { t = sprintf(\"%150000000s\", \"\"); print \"loaded\"; fflush(); system(\"sleep 3600\") }"]
      # 150 MiB of data plus the process itself, with headroom.
      resources:
        requests: {memory: 256Mi, cpu: 50m}
        limits: {memory: 256Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: db
  namespace: example
spec:
  containers:
    - name: db
      image: busybox:1.37
      command: ["sleep", "3600"]
      # Guaranteed = every container has CPU and memory requests equal to limits.
      resources:
        requests: {memory: 128Mi, cpu: 100m}
        limits: {memory: 128Mi, cpu: 100m}
---
apiVersion: v1
kind: Pod
metadata:
  name: batch
  namespace: example
spec:
  containers:
    - name: batch
      image: busybox:1.37
      command: ["sleep", "3600"]
      resources:
        requests: {memory: 128Mi, cpu: 50m}
        limits: {memory: 128Mi}
