# Namespace shared runs two services: db and cache (both HTTP on port 8080).
# Requirements:
# - Only Pods labelled app=api in namespace team-a may reach db. Nothing else may reach anything in shared.
# - team-a keeps its default deny for outgoing traffic, but its api Pods must reach db.shared by name.

# team-a: deny all outgoing traffic (given, keep it).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-egress, namespace: team-a}
spec:
  podSelector: {}
  policyTypes: [Egress]
---
# Every Pod in shared is isolated for ingress; only explicit allow rules let traffic in.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress, namespace: shared}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# One list item with both selectors = AND: Pods labelled app=api AND in namespace team-a.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-api-to-db, namespace: shared}
spec:
  podSelector: {matchLabels: {app: db}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: team-a}}
          podSelector: {matchLabels: {app: api}}
      ports: [{port: 8080, protocol: TCP}]
---
# Egress deny also blocks DNS: allow queries to CoreDNS, then the one real dependency.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-api-egress, namespace: team-a}
spec:
  podSelector: {matchLabels: {app: api}}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: shared}}
          podSelector: {matchLabels: {app: db}}
      ports: [{port: 8080, protocol: TCP}]
