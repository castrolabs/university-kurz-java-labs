# Same Pod as the starter app.yaml before any TODO, kept for comparison. The app reads its database password
# from /etc/app/secrets/DB_PASSWORD every time it opens a connection.
# Operations rotate the Secret db-credentials without restarting Pods.
apiVersion: v1
kind: Pod
metadata:
  name: naive-app
  namespace: example
spec:
  containers:
    - name: app
      image: busybox:1.37
      command: ["sleep", "3600"]
      env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef: {name: db-credentials, key: DB_PASSWORD}
      volumeMounts:
        - name: db
          mountPath: /etc/app/secrets/DB_PASSWORD
          subPath: DB_PASSWORD
          readOnly: true
  volumes:
    - name: db
      secret:
        secretName: db-credentials
