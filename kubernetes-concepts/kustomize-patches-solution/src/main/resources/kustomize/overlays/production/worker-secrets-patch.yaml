# envFrom has no merge key, so a strategic merge patch replaces the whole list: repeat the base entry.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  template:
    spec:
      containers:
        - name: app
          envFrom:
            - configMapRef: {name: app-config}
            - secretRef: {name: worker-secrets}
