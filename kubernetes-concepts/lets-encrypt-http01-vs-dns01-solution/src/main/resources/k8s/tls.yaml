# HTTPS for the shop with a certificate from an ACME CA. In the lab the CA is Pebble; with Let's Encrypt
# only "server" changes (and caBundle goes away, public CAs are trusted already).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: acme
spec:
  acme:
    server: https://pebble:14000/dir
    caBundle: 
    email: ops@shop.lab
    privateKeySecretRef: {name: acme-account-key}
    solvers:
      - http01:
          ingress:
            # cert-manager creates a temporary Ingress for each challenge; it must be served by the
            # controller that receives the CA's request for http://<domain>/.well-known/acme-challenge/.
            ingressClassName: traefik
---
# HTTP-01 proves control of one host name by serving a file on it, so it cannot prove a wildcard: ACME
# offers only DNS-01 for *.shop.lab. With HTTP-01, list every name (one challenge each).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: shop
  namespace: web
spec:
  secretName: shop-tls
  dnsNames: [shop.lab, www.shop.lab]
  issuerRef: {name: acme, kind: ClusterIssuer}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: web
spec:
  tls:
    - hosts: [shop.lab, www.shop.lab]
      secretName: shop-tls
  rules:
    - host: shop.lab
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: shop, port: {number: 8080}}}}
    - host: www.shop.lab
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: shop, port: {number: 8080}}}}
