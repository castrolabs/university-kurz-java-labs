# prod: every role runs the same release, pulled from the company mirror and pinned by digest:
#   registry.lab/mirror/busybox@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
# "images" matches the image name exactly as written in the manifests: "busybox" and
# "docker.io/library/busybox" are the same image to a registry, but two different names here.
images:
  - name: busybox
    newName: registry.lab/mirror/busybox
    digest: sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
  - name: docker.io/library/busybox
    newName: registry.lab/mirror/busybox
    digest: sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
