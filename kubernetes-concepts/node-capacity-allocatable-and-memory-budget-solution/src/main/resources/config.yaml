# /etc/rancher/k3s/config.yaml: k3s reads it at startup (the test copies it in before the node starts).
# Every key is a k3s command-line flag; kubelet-arg passes flags to the kubelet.
#
# allocatable = capacity - system-reserved - kube-reserved - memory eviction threshold.
# The scheduler places Pods against allocatable, so this memory is never promised to workloads.
# eviction-hard replaces the whole default map, so k3s's disk thresholds are repeated here.
kubelet-arg:
  - "system-reserved=memory=512Mi"
  - "kube-reserved=memory=256Mi"
  - "eviction-hard=memory.available<100Mi,nodefs.available<5%,imagefs.available<5%"
