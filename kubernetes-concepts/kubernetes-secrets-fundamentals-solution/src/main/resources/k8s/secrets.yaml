# "echo s3cret | base64" encodes "s3cret\n": the newline is part of the password. stringData takes the
# plain value (the API server encodes it), or use: printf %s s3cret | base64
apiVersion: v1
kind: Secret
metadata:
  name: db-creds
  namespace: shop
type: Opaque
immutable: true          # no in-place changes: rotate by creating db-creds-v2 and rolling out
stringData:
  password: s3cret
---
# get on one named Secret. "list" (and "watch") return full objects, values included, for every Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: reports
  namespace: shop
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [report-creds]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: reports
  namespace: shop
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: reports}
subjects:
  - {kind: ServiceAccount, name: reports, namespace: shop}
