apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
spec:
  replicas: 2
  selector:
    matchLabels: {app: shop, tier: web}
  template:
    metadata:
      labels: {app: shop, tier: web}
    spec:
      containers:
        - name: shop
          image: busybox:1.37
          command: ["sh", "-c", "mkdir -p /www && echo 'shop ok' > /www/index.html && exec httpd -f -p 8080 -h /www"]
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 2
---
# Inside the cluster: http://shop on port 80.
apiVersion: v1
kind: Service
metadata:
  name: shop
spec:
  # TODO-00: This Service has no endpoints. Compare its selector with the Pods' labels.
  selector: {app: shop-web}
  ports:
    # TODO-01: Once it has endpoints, the connection is refused. Where does the traffic really go?
    - {port: 80, targetPort: 80}
---
# Outside the cluster: port 30080 on every node.
apiVersion: v1
kind: Service
metadata:
  name: shop-public
spec:
  type: NodePort
  selector: {app: shop, tier: web}
  ports:
    # TODO-02: The API server rejects this Service. Expose it on node port 30080.
    - {port: 80, targetPort: http, nodePort: 8080}
