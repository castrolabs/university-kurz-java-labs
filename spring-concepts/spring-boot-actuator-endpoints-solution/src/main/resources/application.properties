spring.application.name=Kurz Actuator Lab

# Only "health" is exposed by default — opt in to the rest explicitly, including the
# bonus "prometheus" endpoint contributed by the micrometer-registry-prometheus dependency.
management.endpoints.web.exposure.include=health,info,beans,prometheus
management.endpoint.health.show-details=always

# The env contributor that echoes info.* properties is opt-in on modern Boot.
management.info.env.enabled=true
info.app.name=Kurz Actuator Lab

management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,diskSpace
